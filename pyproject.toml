[project]
name = "genai-service-platform"
version = "0.1.0"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "ai_service_platform",
    "ai_service_platform.core",
    "ai_service_platform.schemas",
    "ai_service_platform.services",
    "ai_service_platform.api",
    "ai_service_platform.rag",
    "ai_service_platform.tests",
    "ai_service_platform.tests.fixtures"
]
